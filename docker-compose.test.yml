services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sic_test
      POSTGRES_USER: sic_test
      POSTGRES_PASSWORD: sic_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sic_test -d sic_test"]
      interval: 5s
      timeout: 3s
      retries: 10
