services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sic
      POSTGRES_USER: sic
      POSTGRES_PASSWORD: sic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sic -d sic"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
