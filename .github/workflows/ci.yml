name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run seed:dry-run
      - run: npm run lint
      - run: npm run build
      - run: npm run test:backend
      - run: npm run test:frontend
      - run: npm run test:e2e
      - run: npm run test:integration
