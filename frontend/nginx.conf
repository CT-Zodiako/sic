server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: todas las rutas van al index.html de Angular
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API: proxy al backend (mismo host Docker, servicio "backend")
  location /v1/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Las cookies de refresh (Path=/v1/auth) pasan tal cual
    proxy_pass_request_headers on;
  }

  # Assets con caché larga (Angular les pone hash al nombre)
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
